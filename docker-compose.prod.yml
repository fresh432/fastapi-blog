version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - web
    networks:
      - blog_network

  web:
    build: .
    env_file: .env
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - mysql
      - redis
    networks:
      - blog_network
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    command: >
      --slow_query_log=ON
      --long_query_time=1
      --log_output=FILE
      --log_queries_not_using_indexes=ON
      --slow_query_log_file=/var/lib/mysql/slow.log
    volumes:
      - mysql_data:/var/lib/mysql
      - ./logs/mysql:/var/lib/mysql
    networks:
      - blog_network

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --aof-use-rdb-preamble yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - blog_network
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

networks:
  blog_network:
    driver: bridge